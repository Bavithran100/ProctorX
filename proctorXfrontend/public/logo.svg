<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="pxGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="pxGlow" x1="12" y1="12" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.3" />
    </linearGradient>
    <filter id="pxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Shield Polygon with Glow -->
  <path d="M24 4L40 12V26C40 34.5 33 41.5 24 44C15 41.5 8 34.5 8 26V12L24 4Z" 
        stroke="url(#pxGrad)" stroke-width="2.5" stroke-linejoin="round" fill="#0F1117" filter="url(#pxShadow)" />

  <!-- Inner Ambient Shield -->
  <path d="M24 8L36 14.5V25C36 31.8 30.5 37.5 24 39.5C17.5 37.5 12 31.8 12 25V14.5L24 8Z" 
        fill="url(#pxGlow)" opacity="0.18" />

  <!-- Precision Crosshair Nodes -->
  <circle cx="24" cy="11" r="1.5" fill="#818CF8" />
  <circle cx="33" cy="25" r="1.5" fill="#06B6D4" />
  <circle cx="15" cy="25" r="1.5" fill="#818CF8" />
  <circle cx="24" cy="37" r="1.5" fill="#06B6D4" />

  <!-- Core "X" Glyph -->
  <path d="M17 18L31 30M31 18L17 30" 
        stroke="url(#pxGrad)" stroke-width="3.2" stroke-linecap="round" />
  <circle cx="24" cy="24" r="2.2" fill="#FFFFFF" />
</svg>
