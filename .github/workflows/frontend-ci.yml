name: Frontend CI Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'proctorxfrontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'proctorxfrontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  test-and-build:
    name: Node.js Testing, Production Bundle Build & Docker Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./proctorxfrontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: proctorxfrontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install

      - name: Run Unit Tests
        run: npm test

      - name: Build Production Vite Bundle
        run: npm run build

      - name: Upload Production Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-bundle
          path: proctorxfrontend/dist/
          retention-days: 7

      - name: Validate Frontend Production Dockerfile Build
        run: docker build -t proctorx-frontend:test .
