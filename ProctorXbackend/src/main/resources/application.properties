spring.application.name=ProctorX
spring.config.import=optional:file:.env[.properties]
# ===============================
# Server & Reverse Proxy (Render SSL Termination)
# ===============================
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# ===============================
# Database (Render / Cloud MySQL)
# ===============================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Pool Tuning (fixes 'No operations allowed after connection closed')
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# Timezone
# ===============================
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# SESSION COOKIE & CORS CONFIG
# ===============================
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_SAME_SITE:None}
server.servlet.session.cookie.secure=${SESSION_SECURE:true}
server.servlet.session.cookie.partitioned=${SESSION_PARTITIONED:true}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile

# Frontend Origin & CORS
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ===============================
# Code Execution Engine (Multi-Compiler & Fallback)
# ===============================
code-execution.primary-provider=${PRIMARY_COMPILER:jdoodle}
code-execution.fallback-enabled=${COMPILER_FALLBACK_ENABLED:true}

code-execution.jdoodle.url=${JDOODLE_URL:https://api.jdoodle.com/v1/execute}
code-execution.jdoodle.client-id=${JD_ID:}
code-execution.jdoodle.client-secret=${JD_SECRET:}

code-execution.onecompiler.url=${ONECOMPILER_URL:https://api.onecompiler.com/v1/run}
code-execution.onecompiler.api-key=${ONECOMPILER_API_KEY:}

# ===============================
# AI Question Generation (Groq / OpenAI-compatible)
# ===============================
ai.groq.url=${GROQ_URL:https://api.groq.com/openai/v1/chat/completions}
ai.groq.api-key=${GROQ_API_KEY:}
ai.groq.model.mcq=${GROQ_MCQ_MODEL:openai/gpt-oss-120b}
ai.groq.model.coding=${GROQ_CODING_MODEL:openai/gpt-oss-120b}

# ===============================
# Cloud Email API (Resend / Brevo over HTTPS Port 443)
# Solves Cloud Host SMTP port 587/465 blocking (Render / Heroku / AWS)
# ===============================
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
brevo.api-key=${BREVO_API_KEY:}

# ===============================
# Spring Mail (SMTP)
# ===============================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=false