spring.application.name=ProctorX
spring.config.import=optional:file:.env[.properties]
# ===============================
# Server
# ===============================
server.port=${PORT:8080}


# ===============================
# Database (Render / Cloud MySQL)
# ===============================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Pool Tuning (fixes 'No operations allowed after connection closed')
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# Timezone
# ===============================
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# SESSION COOKIE (CRITICAL)
# ===============================
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=Lax
server.servlet.session.cookie.secure=${SESSION_SECURE:false}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# Server-side code execution (set these as deployment environment variables).
code-execution.jdoodle.url=https://api.jdoodle.com/v1/execute

code-execution.jdoodle.client-id=${JD_ID}
code-execution.jdoodle.client-secret=${JD_SECRET}

# ===============================
# AI Question Generation (Groq)
# ===============================
ai.groq.url=${GROQ_URL:https://api.groq.com/openai/v1/chat/completions}
ai.groq.api-key=${GROQ_API_KEY:}
ai.groq.model.mcq=${GROQ_MCQ_MODEL:openai/gpt-oss-120b}
ai.groq.model.coding=${GROQ_CODING_MODEL:openai/gpt-oss-120b}

# ===============================
# Spring Mail (SMTP)
# ===============================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=false
app.frontend.url=${FRONTEND_URL:http://localhost:5173}